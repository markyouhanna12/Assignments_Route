<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCM Token Generator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }

      button {
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      textarea {
        width: 100%;
        height: 180px;
        margin-top: 20px;
        padding: 10px;
        box-sizing: border-box;
      }

      #status {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>FCM Token Generator</h1>

    <button id="generateToken">Generate FCM Token</button>

    <p id="status"></p>

    <textarea id="token" placeholder="Your FCM token will appear here..." readonly></textarea>

    <script type="module" src="./app.js"></script>
  </body>
</html>
